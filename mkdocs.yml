site_name: garmin-mcp
site_description: An MCP server for Garmin Connect backed by a complete local DuckDB mirror
site_url: https://justmytwospence.github.io/garmin-mcp/
repo_url: https://github.com/justmytwospence/garmin-mcp
repo_name: justmytwospence/garmin-mcp
edit_uri: edit/main/docs/
copyright: PolyForm Noncommercial 1.0.0. Not affiliated with or endorsed by Garmin.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Clients: clients.md
      - FAQ: faq.md
  - Configure:
      - Configuration: configuration.md
      - Authentication: authentication.md
  - Concepts:
      - How sync works: sync.md
      - The mirror: data/index.md
  - Integrations:
      - Extras: extras.md
      - Strava sync: strava-sync.md
  - Operate:
      - Operations: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Tools: reference/tools.md
      - MCP context and API budget: reference/context.md
      - Schema: data/schema.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/justmytwospence/garmin-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/garmin-mirror-mcp/
