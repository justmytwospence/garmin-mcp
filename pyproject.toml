[project]
name = "garmin-mirror-mcp"
version = "1.5.0"
description = "Garmin Connect MCP server backed by a complete local DuckDB mirror"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md", "NOTICE"]
authors = [{ name = "Spencer Boucher" }]
requires-python = ">=3.12"
keywords = ["garmin", "garmin-connect", "mcp", "model-context-protocol", "duckdb", "fitness", "health", "fit", "strava"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2,<3",
    "garminconnect>=0.3.18",
    "duckdb>=1.4",
    "garmin-fit-sdk>=21",
    "starlette",
    "uvicorn",
    "pytz>=2026.5",
]

[project.urls]
Homepage = "https://justmytwospence.github.io/garmin-mcp/"
Documentation = "https://justmytwospence.github.io/garmin-mcp/"
Repository = "https://github.com/justmytwospence/garmin-mcp"
Issues = "https://github.com/justmytwospence/garmin-mcp/issues"
Changelog = "https://github.com/justmytwospence/garmin-mcp/blob/main/CHANGELOG.md"

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"
garmin-mcp-auth = "garmin_mcp.auth_cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx", "ruff"]
docs = ["mkdocs-material==9.7.7"]

[tool.uv]
# Release cooldown: resolve only releases at least a week old. uv.lock records it, and
# `uv sync --locked` (CI and the Docker build) fails when the lockfile was resolved under
# other settings. To take one release early, add it under [tool.uv.exclude-newer-package]
# with that release's upload time as the date, and remove the entry once it is a week old.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/garmin_mcp", "README.md", "CHANGELOG.md", "LICENSE.md", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py312"
# Long lines are the house style (one statement per line, however long); ruff format is not used.
line-length = 200
src = ["src", "test", "scripts"]

[tool.ruff.lint]
# F: pyflakes (unused imports and variables, undefined names). I: import order. UP: modern syntax.
select = ["F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Modules vendored from Taxuspt/garmin_mcp keep upstream's style so they stay diffable against it.
"src/garmin_mcp/tools/challenge_support.py" = ["UP"]
"src/garmin_mcp/tools/fit_analysis.py" = ["UP"]
"src/garmin_mcp/tools/nutrition.py" = ["UP"]
"src/garmin_mcp/tools/payloads.py" = ["UP"]
"src/garmin_mcp/tools/workout_builders.py" = ["UP"]
"src/garmin_mcp/tools/workout_support.py" = ["UP"]
"src/garmin_mcp/tools/workout_templates.py" = ["UP"]
"src/garmin_mcp/tools/write_errors.py" = ["UP"]
# Test helpers put the test directory on sys.path before importing from it.
"test/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["garmin_mcp"]
# The test helpers next to the tests (test/conftest.py puts the directory on sys.path).
known-local-folder = ["conftest", "fake", "fitgen"]
